name: Build and Publish DEB Package

on:
  push:
    tags:
      - "apisix/*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Default to the OpenResty 1.29 stable line: the API7 patch modules only
  # ship patches up to nginx 1.29.2 (docs/adr/0003). Switching back to the
  # master-branch source build is a one-line change once they ship nginx-1.31
  # patches (mechanism kept in build-apisix-runtime.sh, see docs/adr/0001).
  OPENRESTY_SOURCE: release
  VAR_DEB_WORKBENCH_DIR: /tmp/output

jobs:
  publish_apisix:
    name: Build apisix deb for Debian 12 (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Extract tag version
        run: |
          echo "TAG_VERSION=${GITHUB_REF##*/}" >> "$GITHUB_ENV"

      - name: Init build env
        run: |
          sudo apt-get update
          sudo n lts
          corepack enable pnpm
          mkdir -p "${VAR_DEB_WORKBENCH_DIR}"

      - name: Build apisix-runtime deb
        run: |
          make package type=deb app=apisix-runtime runtime_version=0.0.0 \
            image_base=debian image_tag=bookworm-slim \
            openresty_source=${OPENRESTY_SOURCE}
          mv ./output/apisix-runtime_0.0.0-0~debianbookworm-slim_amd64.deb "${VAR_DEB_WORKBENCH_DIR}/"

      - name: Record runtime provenance
        run: |
          OR_COMMIT=$(docker run --rm apache/apisix-runtime-deb:0.0.0 cat /tmp/openresty-commit || true)
          OR_VERSION=$(docker run --rm apache/apisix-runtime-deb:0.0.0 cat /tmp/openresty-version || true)
          {
            echo "OPENRESTY_COMMIT=${OR_COMMIT}"
            echo "OPENRESTY_VERSION=${OR_VERSION}"
          } >> "$GITHUB_ENV"

      - name: Build apisix deb
        run: |
          # Build only the apisix image on top of the runtime image built in
          # the previous step, then package it. The top-level
          # `make package app=apisix` target would rebuild apisix-runtime by
          # cloning the api7 upstream branch, bypassing the OpenResty source
          # built above.
          make build-fpm
          make build-apisix-deb checkout=${TAG_VERSION} version=${TAG_VERSION} \
            image_base=debian image_tag=bookworm-slim \
            runtime_version=0.0.0
          make package-apisix-deb version=${TAG_VERSION} \
            image_base=debian image_tag=bookworm-slim \
            openresty=apisix-runtime runtime_version=0.0.0
          mv ./output/apisix_${TAG_VERSION}-0~debianbookworm-slim_amd64.deb "${VAR_DEB_WORKBENCH_DIR}/"

      - name: Smoke test on Debian 12
        run: |
          docker run --rm \
            -v "${VAR_DEB_WORKBENCH_DIR}:/output" \
            -e DEB=apisix_${TAG_VERSION}-0~debianbookworm-slim_amd64.deb \
            debian:bookworm bash -exc '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --allow-unauthenticated /output/$DEB
              test -x /usr/local/openresty/bin/openresty
              /usr/local/openresty/bin/openresty -V 2>&1 | head -3
              /usr/local/openresty/luajit/bin/luajit -e "assert(pcall(require, \"resty.limit.traffic\"))"
              /usr/local/apisix/bin/apisix version
            '

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "apisix_${{ env.TAG_VERSION }}_debian12_amd64"
          path: |
            ${{ env.VAR_DEB_WORKBENCH_DIR }}/*.deb
          if-no-files-found: error
